name: OfflineShazam
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    APP_BUNDLE_IDENTIFIER: com.alexmiller.offline-shazam
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
targets:
  OfflineShazam:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: OfflineShazam
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_APP_PROFILE)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Offline Shazam
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Record a short clip to identify music, including when offline.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        # offlineshazam://enroll?url=&token= from Music Sync's enrollment page
        CFBundleURLTypes:
          - CFBundleURLName: offlineshazam
            CFBundleURLSchemes: [offlineshazam]
    dependencies:
      - target: OfflineShazamActivity
  OfflineShazamActivity:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).activity
        PRODUCT_NAME: OfflineShazamActivity
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_ACTIVITY_PROFILE)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Song Capture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  OfflineShazamMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: OfflineShazam
        DEVELOPMENT_TEAM: 467A4PRB8F
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Offline Shazam
        NSMicrophoneUsageDescription: Record a short clip to identify music, including when offline.
        LSApplicationCategoryType: public.app-category.music
        CFBundleURLTypes:
          - CFBundleURLName: offlineshazam
            CFBundleURLSchemes: [offlineshazam]
    entitlements:
      path: Mac/OfflineShazam.entitlements
      properties:
        com.apple.security.device.audio-input: true
  OfflineShazamMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).mactests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OfflineShazam.app/Contents/MacOS/OfflineShazam
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: OfflineShazamMac
  OfflineShazamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OfflineShazam
  OfflineShazamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OfflineShazam
schemes:
  OfflineShazamMac:
    build:
      targets:
        OfflineShazamMac: all
        OfflineShazamMacTests: [test]
    test:
      targets: [OfflineShazamMacTests]
  OfflineShazam:
    build:
      targets:
        OfflineShazam: all
        OfflineShazamTests: [test]
        OfflineShazamUITests: [test]
    test:
      targets: [OfflineShazamTests, OfflineShazamUITests]
